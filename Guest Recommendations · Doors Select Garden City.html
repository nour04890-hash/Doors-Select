:root{--bg:#fcfaf5;--card:#fff;--ink:#142a21;--mute:#5c6b63;--gold:#aa8a50;--line:#e8e1d2;--hero:#142a21;--heroink:#fcfaf5;--chip:#f3eee2;

:root[data-theme="dark"]{--bg:#0e1c16;--card:#162a21;--ink:#f1ece0;--mute:#a3b0a8;--gold:#c9a96a;--line:#264034;--hero:#0a1510;--heroink:#f1ece0;--chip:#1e362b}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:20}
header{background:var(--hero);color:var(--heroink);text-align:center;padding:56px 20px 40px}
.eyebrow{letter-spacing:.35em;font-size:12px;color:var(--gold);text-transform:uppercase}
h1{font:600 clamp(34px,7vw,56px)/1.1 "Cormorant Garamond",Georgia,"Times New Roman",serif;margin:12px 0 10px}
header p{margin:0 auto;max-width:520px;opacity:.8}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hero);padding:10px 12px;display:flex;gap:8px;overflow-x:auto;justify-content:safe center;border-bottom:1px solid var(--gold)}
nav a{color:var(--heroink);text-decoration:none;font-size:13px;white-space:nowrap;padding:7px 14px;border:1px solid #ffffff30;border-radius:99px}
nav a:hover{border-color:var(--gold);color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.search{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
section{margin-top:44px}
.sn{color:var(--gold);letter-spacing:.3em;font-size:12px}
h2{font:600 34px/1.15 "Cormorant Garamond",Georgia,serif;margin:2px 0 4px;padding-bottom:10px;border-bottom:1px solid var(--gold)}
h3{font:600 22px "Cormorant Garamond",Georgia,serif;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:flex-start}
.num{color:var(--gold);font:600 20px "Cormorant Garamond",Georgia,serif;min-width:26px}
.card h4{margin:0;font-size:16px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:99px;font-size:12px;padding:3px 10px;color:var(--ink)}
.chip.yes{outline:1px solid var(--gold)}
dl{margin:0;display:grid;gap:7px}
dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
dd{margin:0;overflow-wrap:anywhere}
dd a{color:var(--ink);text-decoration-color:var(--gold)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.btn{font-size:13px;text-decoration:none;padding:7px 14px;border-radius:99px;background:var(--hero);color:var(--heroink)}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--gold)}
.note{background:var(--chip);border-left:3px solid var(--gold);padding:12px 16px;border-radius:8px;margin:18px 0;font-size:14px;color:var(--mute)}
.note b,.note a{color:var(--ink)}
.empty{display:none;text-align:center;color:var(--mute);padding:40px 0}
footer{background:var(--hero);color:var(--heroink);text-align:center;padding:28px 16px;letter-spacing:.35em;font-size:12px}
</style>
</head>

const NOTES={
 "Cairo Sightseeing":'<div class="note"><b>Ticket reservations</b> — book online at <a href="https://egymonuments.com/locations" target="_blank" rel="noopener">egymonuments.com/locations</a></div>',
 "Best Hospitals near Garden City":'<div class="note">For your convenience, we have provided a list of nearby hospitals and medical facilities. These facilities operate independently and are not affiliated with, endorsed by, or managed by Doors Select. This information is shared solely as a courtesy and for your reference. Doors Select makes no representations or warranties regarding the quality, availability, suitability, or standard of services provided by these third-party facilities and accepts no responsibility or liability for any services, actions, omissions, or matters arising from your engagement with them.</div>'
};
const AFTER={
 "Nearest Pharmacies":'<h3>Supermarket — Grocery Delivery</h3><div class="note" data-s>Order groceries and daily essentials to your suite through <b>Rabbit</b>, <b>Talabat</b> or <b>Breadfast</b>. Use this delivery address:<br><b>20 Aesha El Taymoureya Street, 20th Floor — Room Number: [Your Room Number]</b><br>Once your order arrives, our team will collect it from the elevator and deliver it straight to your room. We hope this makes your stay even more comfortable and enjoyable!</div>'
};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z]+/g,'-').replace(/^-|-$/g,'');
const BOOL=['Sheesha','Alcohol'];
function val(k,v){
  if(k==='Phone'){return v.split('/').map(p=>{const d=p.replace(/[^\d+]/g,'');return d?`<a href="tel:${d}">${esc(p.trim())}</a>`:''}).join(' · ')}
  return esc(v)}
function card(r,i){
  const f=r.f.filter(x=>x[0]!=='Price Range'&&x[0]!=='Ticket Price'&&!(x[0]==='Reservations & Rates'&&/\$|USD|EGP|E£/i.test(x[1]))).map(x=>x[0]==='Reservations & Rates'?['Reservations',x[1]]:x), get=k=>(f.find(x=>x[0]===k)||[])[1];
  const chips=['Distance','Duration'].map(get).filter(Boolean).map(v=>`<span class="chip">${esc(v)}</span>`);
  BOOL.forEach(k=>{const v=get(k);if(v)chips.push(`<span class="chip ${/^yes/i.test(v)?'yes':''}">${k}: ${esc(v)}</span>`)});
  const rest=f.filter(x=>!['Distance','Duration',...BOOL].includes(x[0]));
  const btns=(r.links||[]).map((l,j)=>`<a class="btn ${l[0]==='View on Map'?'':'alt'}" href="${esc(l[1])}" target="_blank" rel="noopener">${l[0]==='View on Map'?'📍 ':''}${esc(l[0])}</a>`).join('');
  const txt=(r.name+' '+f.map(x=>x[1]).join(' ')).toLowerCase();
  return `<article class="card" data-t="${esc(txt)}"><div class="top"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h4>${esc(r.name)}</h4></div></div>
  <div class="chips">${chips.join('')}</div>
  <dl>${rest.map(x=>`<div><dt>${esc(x[0])}</dt><dd>${val(x[0],x[1])}</dd></div>`).join('')}</dl>
  <div class="btns">${btns}</div></article>`}
const nav=document.getElementById('nav'),box=document.getElementById('content');
DATA.forEach((s,i)=>{
  nav.insertAdjacentHTML('beforeend',`<a href="#${slug(s.title)}">${String(i+1).padStart(2,'0')} ${esc(s.title)}</a>`);
  box.insertAdjacentHTML('beforeend',`<section id="${slug(s.title)}"><div class="sn">${String(i+1).padStart(2,'0')}</div><h2>${esc(s.title)}</h2>`+
   s.tables.map(t=>`<div class="sub"><h3>${esc(t.title)}</h3>${NOTES[t.title]||''}<div class="grid">${t.rows.map(card).join('')}</div></div>${AFTER[t.title]||''}`).join('')+`</section>`)});
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();let any=false;
  document.querySelectorAll('.card').forEach(c=>{const m=!v||c.dataset.t.includes(v);c.style.display=m?'':'none';if(m)any=true});
  document.querySelectorAll('.sub').forEach(s=>{s.style.display=[...s.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none'});
  document.querySelectorAll('section').forEach(s=>{s.style.display=[...s.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none'});
  document.getElementById('empty').style.display=any?'none':'block'});
</script>
